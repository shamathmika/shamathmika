name: pet

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: pet
  cancel-in-progress: false

jobs:
  tend:
    if: github.event_name == 'schedule' || startsWith(github.event.issue.title, 'pet|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tend the pet
        id: pet
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            go run ./cmd/pet render
          else
            go run ./cmd/pet act --user "$ISSUE_USER" --title "$ISSUE_TITLE"
          fi

      - name: Commit
        env:
          MESSAGE: ${{ steps.pet.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets state
          if git diff --cached --quiet; then
            echo "nothing to save"
          else
            git commit -m "$MESSAGE"
            git push
          fi

      - name: Reply and close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ steps.pet.outputs.reply }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
