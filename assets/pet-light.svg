<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 212 200" width="212" height="200" role="img" aria-label="Jack looks content">
  <title>Jack looks content</title>
  <style>
    .idle{animation:breathe 4.5s ease-in-out infinite;transform-origin:90px 176px}
