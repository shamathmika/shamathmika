    .react{animation:hop 1.1s ease-out 0.5s both;transform-origin:90px 176px}
    @keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}75%{transform:translateY(-5px)}100%{transform:translateY(0)}}
    .prop{animation:drop 1.2s ease-in both}
    @keyframes drop{0%{opacity:0;transform:translateY(-96px)}15%{opacity:1}70%{opacity:1;transform:translateY(0)}88%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.idle,.react,.prop,.prop2{animation:none}.prop,.prop2{opacity:0}}
  </style>
